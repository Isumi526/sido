name: Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - dev
      - develop
    paths:
      - 'apps/gas/**'
      - 'apps/liff/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'

jobs:
  # ── Edge Functions デプロイ ───────────────────────────────────────
  deploy-edge-functions:
    name: Deploy Edge Functions (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # version: latest はリリース照会＋latestバイナリ取得でGitHub側Gateway Timeoutにより
          # 時々失敗するため、既知良好版に固定して安定化（必要時に上げる）。
          version: 2.75.0

      - name: Deploy Edge Functions (dev → test prefix)
        if: github.ref_name == 'dev'
        run: |
          FUNCTIONS="submit-report notify-edit notify-error get-master"
          for fn in $FUNCTIONS; do
            cp -r supabase/functions/$fn supabase/functions/test-$fn
            supabase functions deploy test-$fn \
              --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
              --no-verify-jwt
            rm -rf supabase/functions/test-$fn
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions (main → production)
        if: github.ref_name == 'main'
        run: |
          # supabase/functions/ 配下の実関数を全てデプロイ。
          # ★ test-* は本番に出さない（test関数非デプロイの原則）。_shared と非関数dirも除外。
          # ※ 固定リストだと新規関数のデプロイ漏れが起きるため全量デプロイにする。
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            case "$fn" in
              _shared) echo "skip non-function: $fn"; continue ;;
              test-*)  echo "skip test function (本番に出さない): $fn"; continue ;;
            esac
            [ -f "$dir/index.ts" ] || { echo "skip (no index.ts): $fn"; continue; }
            echo "deploying $fn ..."
            supabase functions deploy "$fn" \
              --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
              --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── Vercel デプロイは Git Integration が担う（この workflow では行わない）──────
  # 旧 deploy-vercel job は削除した（2026-07-25）。理由:
  #  1. 二重デプロイ: apps/liff は Vercel の Git Integration が main への push で自動デプロイしている。
  #     裏付け = apps/liff/vercel.json の "git":{"deploymentEnabled":{"dev":false}}（dev のみ無効化＝main は有効）。
  #     実測 = PR #71 のマージ 22:26 に対し本番 https://sido-liff.vercel.app のキャッシュ生成が 22:31。
  #  2. 恒常的に失敗していた: apps/liff/.vercel/project.json の settings.rootDirectory="apps/liff" と
  #     job 側の working-directory: apps/liff が二重に適用され、
  #     "The provided path .../apps/liff/apps/liff does not exist" で 15 回以上連続 failure。
  #     本番反映は Git Integration が担っていたため実害は無かったが、CI が常に赤いと本物の失敗に気づけない。
  #  ※ apps/admin も同様に Git Integration 経由（この workflow に job は無い）。
